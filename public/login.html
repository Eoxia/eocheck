<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOCheck - Connexion & Inscription</title>
  <meta name="description" content="Connexion sécurisée au service EOCheck">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="brand">
      <span>🛡️ EOCheck</span>
      <span class="brand-badge">eoxia.com</span>
    </a>

    <div class="user-nav" id="userNav">
      <a href="login.html" class="btn btn-primary btn-sm">Se connecter</a>
    </div>
  </nav>

  <main class="container">
    <div id="authSection" class="card" style="max-width: 480px; margin: 4rem auto;">
      <div class="card-title">
        <span id="authTitle">🔑 Connexion EOCheck</span>
      </div>

      <!-- Hidden CSRF token field -->
      <input type="hidden" id="csrfTokenInput" name="_csrf" value="">
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Adresse E-mail</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="admin@eoxia.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
      </form>

      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="regEmail">Adresse E-mail</label>
          <input type="email" id="regEmail" class="form-control" placeholder="user@eoxia.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Mot de passe</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Créer un compte</button>
      </form>

      <div style="margin-top: 1.25rem; text-align: center;">
        <a href="#" id="toggleAuthBtn" onclick="toggleAuthMode(event)" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">Pas encore de compte ? S'inscrire</a>
      </div>
    </div>
  </main>

  <footer>
    EOCheck &copy; 2026 - Plateforme de Scan & Gestion d'API Eoxia | eocheck.eoxia.com
  </footer>

  <script src="js/csrf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
